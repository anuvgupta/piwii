# piwii: no NFSv4 delegations for the staging share.
#
# With a read delegation the server host trusts its cached copy of a file
# without asking the Pi, and the Pi must recall it whenever the file changes.
# piwii-status replaces staging/status/pi-status.json every 5 s; when one recall
# didn't land, the server host kept reading a 70-minute-old status with no error
# on either side. nfsd only hands out delegations when file leases are enabled,
# so turning leases off stops them. The server host then re-checks these small
# files within seconds instead of trusting a cache that never expires. Nothing
# else on the Pi uses file leases.
fs.leases-enable = 0
